# Cross-platform proof for the harness.
#
# posix-lint is its own Ubuntu job: executing a script under Git-for-Windows sh or macOS /bin/sh only
# proves bash-in-POSIX-mode accepted it, and ShellCheck is preinstalled on ubuntu runners only.
# The CR scan runs inside the matrix because line endings must be asserted on the platform that can
# break them. fail-fast is off so one failing leg cannot cancel the others; macOS is verified nowhere else.
#
# Rules this file obeys:
#   * Every action is pinned to a 40-character commit SHA with the tag as a trailing comment, because
#     tags are mutable and these runners hold a checkout and a token. The comment is part of the pin:
#     tests/unit/ci-pinning.test.ts holds the audited (SHA, tag) table and the pin-audit step below
#     re-resolves every comment through the API. Update both whenever a SHA or tag changes.
#   * defaults.run.shell is bash, otherwise the Windows runner falls back to pwsh.
#   * No line-ending fix-up step: .gitattributes (`* text=auto eol=lf`) is the fix and the CR scan
#     is the proof. A git config step would mask a broken .gitattributes.
#   * Every install carries --ignore-scripts.

name: ci

# push is limited to main so a PR from a branch in this repo does not trigger two runs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  posix-lint:
    name: posix-lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck every tracked shell script as POSIX sh
        run: |
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "::error::no tracked *.sh files -- a lint over nothing is a vacuous pass"
            exit 1
          fi
          echo "linting:"
          for f in $files; do echo "  $f"; done
          shellcheck --version
          shellcheck --shell=sh --severity=style $files

      # Checks each tag comment against the registry, which the offline table in ci-pinning.test.ts cannot.
      - name: pin-audit -- every tag comment must resolve to the pinned SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each surviving line is `<owner/repo@sha> <tag>`; the pattern anchors uses: to the line start.
          sed -n 's/^[[:space:]]*-\{0,1\}[[:space:]]*uses:[[:space:]]*\([^[:space:]#]*\)[[:space:]]*#[[:space:]]*\([^[:space:]]*\).*/\1 \2/p' \
            .github/workflows/*.yml | sort -u > pins.txt
          if [ ! -s pins.txt ]; then
            echo "::error::pin-audit matched no pinned action lines -- an audit over nothing is a vacuous pass"
            exit 1
          fi
          fail=0
          while read -r ref tag; do
            repo=${ref%@*}
            sha=${ref#*@}
            actual=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null || echo "")
            # An annotated tag points at a tag object; peel it to the commit the SHA pin must equal.
            while [ "${actual%% *}" = "tag" ]; do
              actual=$(gh api "repos/$repo/git/tags/${actual#* }" --jq '.object.type + " " + .object.sha' 2>/dev/null || echo "")
            done
            actual=${actual#* }
            if [ -z "$actual" ]; then
              echo "::error::$repo has no tag $tag -- the comment names a release that does not exist"
              fail=1
            elif [ "$actual" != "$sha" ]; then
              echo "::error::$repo is pinned at $sha but $tag resolves to $actual -- the comment is wrong, the SHA may be too"
              fail=1
            else
              echo "  ok  $repo@$sha is $tag"
            fi
          done < pins.txt
          rm -f pins.txt
          exit $fail

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22.19.0 is the floor Pi's `engines` declares and 24.x is the current line, so code needing a
      # newer Node fails here rather than on a machine that meets the documented requirement.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # node rather than `grep -P` or `file`, which behave differently across the three platforms.
      - name: Assert every tracked shell script checked out with LF
        run: |
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "::error::no tracked *.sh files -- the CR scan would assert nothing"
            exit 1
          fi
          fail=0
          for f in $files; do
            if node -e 'process.exit(require("fs").readFileSync(process.argv[1]).includes(13) ? 1 : 0)' "$f"; then
              echo "  LF ok   $f"
            else
              echo "::error file=$f::CR byte found -- .gitattributes eol=lf did not apply on this runner"
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The load-path tests throw rather than skip when `pi` is absent, so CI supplies the pinned binary.
      - name: Install the pinned Pi globally
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.1.0

      - name: Run the full suite (unit + integration)
        run: npx vitest run

      - name: Syntax-check the bootstrap under sh
        run: sh -n bin/bootstrap.sh

      # --check-only runs every probe and repo-side assertion and mutates nothing.
      - name: Execute the bootstrap in check-only mode
        run: sh bin/bootstrap.sh --check-only

      # GitHub runners ship a `gh` authenticated via GITHUB_TOKEN, so a bare run would exit 1 every
      # time; --warn-only reports the /share exposure without failing the build.
      - name: Report the /share (gh auth) exposure
        run: sh scripts/check-gh-unauthenticated.sh --warn-only

      - name: Typecheck against Pi's shipped .d.ts
        run: npx tsc --noEmit
